models:
  config.model.primary_model:
    type: literal
    agents: [_researcher]
  gemini-2.5-flash:
    type: default
    agents: [agent.create_index_analyzer_agent, agent.create_data_explorer_agent, agent.SpecificADKAgentWrapper, agent.DataExplorerAgent,
      agent.ResearcherAgent, index_analyzer_agent, index_analysis_flow_agent, result_synthesizer_agent, search_guru_agent,
      splunk_mcp_agent., agent]
  model_instance:
    type: literal
    agents: [agent.get_adk_agent.0, agent.get_adk_agent.1, agent.BaseAgent._llm_agent, agent.get_adk_agent.2, agent.get_adk_agent.3,
      splunk_mcp_agent._llm_agent, agent.get_adk_agent.5, micro_agent, agent.get_adk_agent.6]
  orchestrator_model:
    type: literal
    agents: [orchestrator]
  self.config.model.primary_model:
    type: literal
    agents: [agent.get_adk_agent.4, agent.get_adk_agent.7]

tools:
  agent_tool:
    type: agent
    agents: [agent.get_adk_agent.6]
    params:
      wrapper: AgentTool
      agent: adk_agent
  all_tools:
    type: function
    agents: [orchestrator]
    params:
      dynamic: "True"
  flow_tools:
    type: function
    agents: [agent.get_adk_agent.1, agent.get_adk_agent.2]
    params:
      dynamic: "True"
  google_search:
    type: module
    agents: [_researcher]
  google_search_grounding:
    type: function
    agents: [agent.get_adk_agent.4]
  google_search_grounding.1:
    type: agent
    agents: [_researcher]
    params:
      wrapper: AgentTool
      agent: _researcher
  mcp_toolset:
    type: function
    agents: [splunk_mcp_agent._llm_agent, agent.get_adk_agent.5]
  self.tools:
    type: function
    agents: [agent.BaseAgent._llm_agent]
    params:
      dynamic: "True"
  tools:
    type: function
    agents: [agent]
    params:
      dynamic: "True"

mcp:
  mcp_toolset:
    type: network
    url: self.config.splunk.mcp_server_url
    agents: [agent, agent.get_adk_agent.5, splunk_mcp_agent._llm_agent]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPConnectionParams
      headers: headers
      timeout: "15.0"
      sse_read_timeout: "300.0"
      terminate_on_close: "True"
      max_retries: "2"
      retry_delay: "1.0"
  MCPToolset:
    type: network
    url: self.config.splunk.mcp_server_url
    params:
      class: SearchGuru
      connection_type: StreamableHTTPConnectionParams
      headers: headers
      timeout: "15.0"
      sse_read_timeout: "60.0"
      terminate_on_close: "True"
      max_retries: "2"
      retry_delay: "1.0"
      tool_filter: [get_spl_reference, get_splunk_documentation, get_splunk_cheat_sheet, list_spl_commands, get_troubleshooting_guide,
        get_admin_guide, list_troubleshooting_topics, list_admin_topics]
      function: _create_mcp_toolset_for_spl_reference
  McpToolset:
    type: process
    params:
      class: McpToolset
      connection_type: StdioConnectionParams
      connection_variable: connection_params
      server_params: server_params
      terminate_on_close: "True"
      timeout: timeout
      function: create_mcp_agents

