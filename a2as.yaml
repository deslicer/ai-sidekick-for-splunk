    args: [self, search_query, agent_id]
    params:
      returns: tuple
  validate_template_file:
    type: sync
    module: src.ai_sidekick_for_splunk.cli.validate_template
    args: [self, template_path]
    params:
      returns: dict
  validate_workflow_consistency:
    type: sync
    module: src.ai_sidekick_for_splunk.core.flows_engine.workflow_models
    args: [self]
  validate_workflow_file:
    type: sync
    module: src.ai_sidekick_for_splunk.core.flows_engine.workflow_models
    args: [template_path]
    params:
      returns: WorkflowTemplate
  validate_workflow_id_format:
    type: sync
    module: src.ai_sidekick_for_splunk.core.flows_engine.workflow_models
    args: [cls, v]
  validate_workflow_json:
    type: sync
    module: src.ai_sidekick_for_splunk.cli.validate_workflow
    args: [workflow_path, verbose]
    params:
      returns: tuple
  validate_workflow_template:
    type: sync
    module: src.ai_sidekick_for_splunk.core.flows_engine.workflow_models
    args: [template_data, template_path]
    params:
      returns: WorkflowTemplate
  validation_metadata:
    type: sync
    module: src.ai_sidekick_for_splunk.core.flows_engine.agent_flow
    args: [self]
  visit:
    type: sync
    module: src.ai_sidekick_for_splunk.core.registry
    args: [component_name]

