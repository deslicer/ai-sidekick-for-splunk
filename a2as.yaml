files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.yaml', '*.json']
      caller: [get_available_templates, _scan_directory, _reconstruct_workflow_from_metadata, main]
  .json:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [output_dir]
  .template_source:
    type: literal
    actions: [read]
    params:
      caller: [create_default_workflow, create_from_template_file]
      path: [output_dir]
  .venv:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [self.project_root]
  .yaml:
    type: literal
    actions: [read]
    params:
      caller: [main, create_default_workflow, create_from_template_file]
      path: [base_path]
  /etc/os-release:
    type: literal
    actions: [read]
    params:
      caller: [open, get_system_info]
      alias: [f]
  agent.py:
    type: literal
    actions: [read]
    params:
      caller: [main, create_agent_files]
      path: [agent_dir]
  agent_dir:
    type: variable
    actions: [write, delete]
    params:
      caller: [agent_dir.mkdir, shutil.rmtree]
  agent_file:
    type: variable
    actions: [read, write]
    params:
      caller: [agent_file.read_text, agent_file.write_text]
  agents_dir:
    type: variable
    actions: [write]
    params:
      caller: [agents_dir.mkdir]
  args.output_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  args.template_file:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  config_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  create_agent.py:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [project_root]
  current_path:
    type: variable
    actions: [read]
    params:
      caller: [Path.cwd()]
  definitions_dir:
    type: variable
    actions: [read]
    params:
      caller: [definitions_dir.iterdir]
  example_path:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  file_path:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load, file_path.parent.mkdir]
      alias: [f]
  flow_definition_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  health_check.json:
    type: literal
    actions: [read]
    params:
      caller: [create_health_check_flow_pilot]
      path: [Path.parent.parent.parent]
  index_analysis.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__, create_index_analysis_flow_pilot]
      path: [current_dir.parent.parent]
  integrate-agent.sh:
    type: literal
    actions: [read]
    params:
      caller: [main]
      path: [project_root]
  json_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  json_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load, Path]
      alias: [f]
  logs/app.log:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  orchestrator_prompt_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path('src/ai_sidekick_for_splunk/core/orchestrator_prompt.py'), orchestrator_prompt_path.read_text, orchestrator_prompt_path.write_text]
  output_dir:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(args.output_dir), output_dir.mkdir]
  output_file:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  output_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(args.output_json), open]
  path:
    type: variable
    actions: [read]
    params:
      caller: [Path.cwd.resolve(), open, json.load]
  prompt.py:
    type: literal
    actions: [read]
    params:
      caller: [main, create_agent_files]
      path: [agent_dir]
  prompt_file:
    type: variable
    actions: [read, write]
    params:
      caller: [prompt_file.read_text, prompt_file.write_text]
  pyproject.toml:
    type: literal
    actions: [read]
    params:
      caller: [resolve_project_root, find_project_root, setup_logging]
      path: [parent]
  README.md:
    type: literal
    actions: [read]
    params:
      caller: [main, create_agent_files]
      path: [output_dir]
  readme_file:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  source_file:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  src/ai_sidekick_for_splunk/core/orchestrator_prompt.py:
    type: literal
    actions: [read]
    params:
      caller: [update_orchestrator_prompt]
  system_info.json:
    type: literal
    actions: [read]
    params:
      caller: [create_system_info_flow_pilot]
      path: [Path.parent.parent.parent]
  temp_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  template_dir:
    type: variable
    actions: [read]
    params:
      caller: [template_dir.glob]
  template_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  template_file_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, Path]
      alias: [f]
  template_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.template_file)]
  templates_dir:
    type: variable
    actions: [read]
    params:
      caller: [templates_dir.glob]
  workflow_file:
    type: variable
    actions: [write, read]
    params:
      caller: [open, json.load]
      alias: [f]
  workflow_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]

processes:
  python:
    type: shell
    actions: [exec]
    args: [[str(helper)]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
      ref: sys.executable
